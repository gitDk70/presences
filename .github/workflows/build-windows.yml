name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install openpyxl pyinstaller --quiet
          pip uninstall pathlib -y 2>nul || true

      - name: Build EXE
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --clean `
            --noconfirm `
            --name "Presences" `
            --add-data "user.png;." `
            presences.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Presences-Windows
          path: dist/Presences.exe
